[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "systemai-core"
version = "1.0.0"
description = "SystemAI V1: trusted local-first operating intelligence core with developer-environment diagnosis and verified repair."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{name = "SystemAI Project"}]
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psutil>=6,<8",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
ai = ["openai>=2,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
systemai = "systemai.main:main"
systemai-api = "systemai.api.run:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["systemai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
